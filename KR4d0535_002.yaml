body:
  text: 子淵詩集卷二元張仲深撰七言古詩負暄行野人多病卧竹牀新寒中骨飢欲僵呼兒扶傴出門去窮閻愛日如探湯初疑冬烘可炙手漸若醇酎充枵腸玉山曉煦釋隂凍已勝狐腋生春陽野人家有一畝宮女能緝麻婦能桑今年絲枲頗豐牣里胥橫斂需官糧遂令方冬禦單夾至使卒歲無衣裳世間貴遊多步障千金買裘繡鴛鴦羅幃貯嬌厭紈綺尚有文繡蒙宫牆豈知窮檐有真趣不炎不凛春風長方今戰士苦寒栗介胄生蝨罹風霜急當持之獻天子願賜被服照恩光遊武當别峯次姜可玉韻夜深忽夢雙鶴來夢回但見山容開侵山故故入山去雪埋老樹深莓苔倚花問鶴鶴無語劈琴刲鶴和花煮定知一食生羽翰飛去蓬萊聽風雨疇昔我生愛山殊有癖日日登山訪幽寂故人江陳三五輩醉卧青溪掄白石踏霜采杞琲盈把拂曉題詩雲滿壁文筆峯前動客吟百花嵓底留行跡故人别去動經載溪山溪水總相憶今年海口獨棲遲塊爾窮居自紬繹我家嵓壑明越州看山看水豈終極酒酣秪上知章船醒後還尋謝安屐我今出門但平原夢欲尋山了無覔臨風時復一想像致使心脾結沉鬱州縣稻梁雖自足江海風塵久難息人生得意須勝逰莫使沉吟念疇昔送危太朴檢討還京詔修三史求遺書至四明臨川先生富文學願見久矣不可親夜占使星動牛斗曉聞官軺薄東鄞欣然出門往見之向者佩誦今始真才華籍籍三十載積學所至非鬼神銀蜍濯海秋旦旦淑氣鬯物春津津大朝士流日以盛玉堂掌故俱薦紳煥章三朝舊文物直與造化同陶甄公行采訪及遺俗禮繁樂縟皆陳陳忠端奸佞等黃土尚藉竹帛昭瑜珉董狐馬遷不可作嗚呼千載公其人我生我生失怙口尚乳兄弟伶仃母孤撫母年六十子三十夜共青燈守環堵母言夫死當從子子當讀書樹門戶治麻貿書欲教汝織絍為衣仍衣汝至今遊子身上衣尚帶西窗夜深雨今年八月拜高堂因上西州歷東土却聞江南張公子自築岑樓踰峻宇江湖往往見詩章州縣時時有人語已知溫凊足滫􅔱雪堇氷鱗日能取白雲却覆樓前萱綵衣每仆樓上廡貞心擬報三春暉素懷直與明月伍用勞詎但慕曾仲不匱還當法姚禹我觀浮俗苦不然輕薄紛紛焉足數豈知孝者乃天常反以非常事誇詡我因感君悟兹理便欲移家成一聚非關族譜能相通自愛襟懷同出處我今未解搆數居千里翻令倚閭苦詩成蚤晚理歸舸免使庸庸等䂥碔題蒼龍出浪圖老龍吹浪蒼雲濕萬丈銀潢掛遙碧泰華倒景天柱搖電母蟠空轟霹靂道人胸次溟渤寬高堂六月生晝寒墨花濺香夜欲滴晴漦護靄秋不乾曉蹴雲衢留步武上際文明當九五天瓢未可私吾鄉逺近蒼生待霖雨胡用和聽雪窩九冥使者令行肅怒叱剛飈逐滕六驕雲壓地凝不流萬里寒稜逼人目一齊函丈大於斗四壁生輝瑩如玉夜深危枕支詩魂衾鐵稜稜似龜縮戰酣凍蟻寂不聞獨訝春蟲暝中撲是誰碎剪銀潢波亂撒珠璣三萬斛初疑入幕勢斜斜時復緣窗聲􅉡􅉡夢魂無路覔寒梅詩思翻驚折危竹長安客舍清於氷亦有羇栖抱幽獨門前自絶車馬塵釡上曽無肉為粥東鄰西里富熏天細醖羊羔酒初熟酒酣把玩溫柔鄉豪竹輕歌貯金屋但知聲色樂意長豈信齊居清聽足高人胸次無一塵肯附輪蹄競馳逐政如袁安不出門自擬焦光眇庸俗囓氊朔窖耳孰聆擊䳱縣弧事誰續從渠簡册紀勳庸我獨忘榮亦忘辱起呼小姬煮春茗懶具扁舟泛溪曲更結心齊聽以心擊壤高歌繼芳躅懸知海上來歲豐農圃無勞問雞卜為蘄縣翼王萬户題霜落江南凌萬木日夜西風到林屋壁間古劔搖芙蓉帳底青燈朵紅粟將軍好武復好文一段精神照人目酒酣舞劔回電光時復挑燈藹藝馥良弓在檠不動塵風鐵鏦錚戰櫩曲三軍號令寂無譁萬竈貔貅自清肅立當要路鎮雄藩不比常途閒食肉公餘息宴動微吟兩袖驪珠紛可掬瀛洲自此生輝光雞林豈惜千金贖黃簾不卷秋滿堂分得蟾華夜如玉山之雲山之雲白央央陵晨出山作霖雨薄暮栖向巖扄藏山之雲央央白觸石之勢絪緼不可遏不可遏天下蒼生待甘澤菊東山人歌黃華山下蒼顔翁自云家住東籬東籬根野菊不待種年年著葉秋滿藂去年花開金纂纂今年花開大如碗走傍高陽喚酒徒更向南鄰覔詩伴對花把酒花欲言花言爾曹何太顛只今􅐓洞干戈際胡為落魄風霜前何不臂鎗驟射競奔走笑取金印纍纍大如斗歸來狂歌痛飲花前酒山翁對花前致辭功名富貴胡足竒世間豪華熾如火德薄奉厚俱傾危殷勤勸花酒花亦為豫壽忘形到花我臨風但三嗅起來傾倒老瓦盆醉即長歌時一扣吁嗟乎花開花暗秋復秋人生白髮為花羞我曹相逢强作開口笑醉歸共插花滿頭贈徐仲裕混沌夜鑿𤣥黃剖書契創録垂不朽誰將汗簡編湘雲渥漆濡丹示悠久蒼頡餘製見鳥跡孔壁遺形有蝌蚪篆籕孰啓氷斯先分𨽻每變鍾王後後來衆體多紛更幻若浮雲化蒼狗徐君適生千載下體法潜心希八九妙知化與心神融造化無端落吾手儼如泰否通往來解使隂陽成雜揉江南此藝雖云多探賾鈎𤣥只君有方今四海洽文化擬作般那頌元后摩崖秦嶺空崢嶸妙手須君鐫岣嶁贈蕭君佑人孰無父母蕭君有父生能致其養死能枕塊啜粥終朞祥人孰無兄弟蕭君有弟有財弗與爭有爵克讓使之垂休光世人不識蕭君賢蕭君孝友因心然昔年烏府躬槧牘俸錢散盡兒啼寒七閩蠻瘴繞榕樹驛騎嚼銜嘶薄暮平生願效王家勞十載曽無致身處世間亦有輕薄兒紆拖青紫安輕肥豈知孝友因心有秪使骨肉常乖離皇天不為蕭君私烏臺柏府豈無賢者知己知天爵修於斯自有人爵來如期嗟哉蕭君慎勿傷暮遲嗟哉蕭君慎勿傷暮遲贈朱敬之葩雲縹眇連三島古堞高懸浙東道七城斗列奠南邦吹徹梅花海門曉紫陽仙客天上來踏踏驕蹄春騕裊簿書鞫讞自清幽玉帳參謀笑談了十年省署足優遊一日瀛洲事幽討團團薇露滴晴垣濯濯蓮香沉秋沼遂令胸次飽清腴時復霜毫恣揮掃丹青雜揉絢天葩破墨淋漓敓華藻書生有母抱孤真素髮蕭蕭已垂老願持色筆發潜輝解使深恩等鈞造贈錢善長士也在世應時需自知忠孝非兩途忠當事君罄𠂻赤孝當養親服勤劬書生有母已垂白屢易星霜抱氷蘗朝廷化成多美意肯使孤真竟淪匿惟公素稱長者家筆端霜氣秋生花柏臺騰譽七郡肅片言折獄曽無譁書生景慕已有年願持彩筆成陶甄子能盡孝母佩德載拜深恩即二天贈茜涇張伯起厥初何人鑿混沌一氣周流自融渾祕樞密運隂陽根萬化生成靡增損弛張忽有一毫沴峙者不墮流者紊乃知調燮在宰衡手握乾綱契深懇若人戴履參為三氣志在躬知默吻和則榮衛生絪緼戻則疲癃雜憂忿政如隂陽有驕蹇必假良醫一詳診欲探六脈致調和曷審三因正標本張君明醫繼五世究心深入岐黃閫濟生自有神聖功立志豈伊庸俗混窮當衛世康斯民逹則調元思補衮自知窮逹理一致不管衣巾走塵坌我生於世竟無補從此因君當發憤致身未斷出處期尚抱遺經作儒隱贈鄮山汪彥通憶昔少小同閭里草年東西若流水子能掉古侯王門我得晨昏致親喜是時世道多暌乖風塵澒洞連兩淮官軍對壘苦死戰守令治劇愁顛崖參政旌旗控三嶺子䇿端能復侵境不謀駟馬印纍纍坐取一官甘獨冷鄮山宛在水中央過橋琴珮春風長諸生堂下稍羅列兩供俱闕同荒凉三倚秋亭弄雲月坐上青氊又思徹故家只住湖西頭踏破門前三尺雪海陵行為秦州袁子英賦海陵孝子身姓袁弱年喪父母獨存闔門老稚百十指怡愈日夕同盤飱前年盜賊掠州縣通州泰州漲煙焰玉石處處俱蕩焚母子家家不相見袁携妻女負母行妻流女離難為情未論妻女得相保且負老母逃餘生女泣父母婦泣姑父覔妻女妻覔夫女妻子母復相見喜悲交集氣始蘇蒼生不解皇天意泰否剝復常相繼非因袁子有純誠豈使一門全孝義嗟爾袁子孝且慈世人已識天已知他年驄馬訪民俗海陵為我陳此詩青松枝青松枝青丕丕手把青松枝為君酌别離松枝顔色年年好常恐人生鬢毛老願君操比青松枝天寒歲晏終不移次沈元晉蓮花韻方塘過雨新流急高栁𤣥蟬為誰泣故家池館藕生花萬柄參差水中立亭亭盡作妖冶容粧明不假鉛華濃碧雲低擁浣紗女花房亂搗紅守宫水晶宮殿開南北萬頃琉璃湛秋色仙人太乙忽相逢冏冏方曈照空碧自言家住青溪濵年年種花驚水神華開茜素千萬朵采之寄贈相思人殷勤為道相思苦眼底風塵暗淮楚苦心自抱清白姿素質不隨泥垢汙擷芳採緑當製衣為逃濁世非眩竒他年玉食許同貢只在苕溪與霅溪詠罷仙人駕蓮葉手把洞簫吹不徹回頭池館起西風十里煙雲華似雪白龍洞地盡東南滄海據龍窟蛟宫自無數客行千里見山髙却到東州地窮處人傳山有白龍居拄策何辭一徒步我因好竒細詢之父老無能道其故乃知滄海蛟龍多天遣行雲作霖雨懶為翻身歸故窟暫戢鱗鰭此中住上連碧巘欲南奔下泄清流自東注老石暗結生雲根虛谷潜通上天路風雷三月動地來洞口時聞頭角露常陪白帝行清秋要與塵寰洗炎霧遍施九土商家霖晝踏天衢自回去馮夷海若遙相迎歸卧瀛洲紅日暮羊寶同郡黃直夫自言嘗至河間武清縣得一羝既而刲之獲其腸中所蓄如彈而色黑者六十枚初未之省盡棄之乃留一二以視其土人曰羊寶也世罕得之得之則可以療腸胃間疾遂藏以歸因視餘枚作詩紀其實焉客舟昔艤武清浦不惜囊金得肥羜夜間秋月㺯蟾華晚嚙靈苗卧春雨未知秀異生膟膋已覺輝光澤毛羽自從割鮮得所見粲若驪珠紛可數寸螺㸃漆墨凝花一一勻圓訝如許世貪為寶嫓璣琲我愧無知等塵土蒼龍有珠徒想像青兕生黃互吞吐何如此寶禆世用解療膏肓安肺腑牛溲馬勃曷足論羚角麋茸諒無補黃君自此什襲藏價擬連城越珉碔焚香展襲始一見顧我求之嘗至屢貪看掌內紺珠新海上還丹皆妄語我知此物非世留嘗恐雷公潛竊取自憐把玩晝生輝只合持之奉明主方今海內多瘡痍願濟黔黎周瘵苦定知官帑輸千金韞櫝深藏勿姑與舟中荷花汪即之種荷小瓦盆中花盛開載於舟面回是夕叔載同宿舟中賦詩就次韻臨平五月花連岸曽買扁舟月中看綵鸞踏空乘夕回聞有三江名一縣當年眉山草木枯此日源口泉林變君家早祖筆生花至使文華後人見祗因要結青山緣致令不上黃金殿大器還期在晚成㑹稽終遂平生願我家兄弟亦讀書夜夜燈窗事鉛槧兄年四十弟三十著鞭非敢奔而殿功名已信命使然造物由來不私眷要知得喪理一致共鑽吾道其無倦題陳元昭雪篷幽人久住湖南隅開門看月雪滿湖團團茅齊小如舸宛若身世江湖居夜深夢入剡溪曲青簾白舫如吾廬似嫌清氣生肘腋坐覺寒景橫瞳矑夢回但訝夜生白恍若雪浪搖窗虛起來作詩不可紀呵氷寫作山隂圖題張小山君子亭我嘗西湖謀卜居前有水竹後芙蕖羈紅縻翠眩人目雲錦倒映青珊瑚歸來試問隱者廬嘉葩美植同紛敷綵鸞踏空夜不啄文鴛隕粉秋生珠竹秉君子操蓮如君子清我亭居其中樂以君子名道人寓物不著物豈唯物美唯德稱滿簾花氣香馥馥一亭翠景風泠泠願君志如蓮濯淤泥而不染操如竹拍霜雪而不零我今聞之當乞盟製荷為衣竹為策逈謝濁世全吾生挾彈圖輕羅裁衫紅纂纂五明馬踏春雲暖平康殢酒夜忘歸曉挾雕弓明月滿栗留多在髙樹枝好音恰恰傷春啼彈丸落手恣梟磔肯如鷗鷺終忘機嗟爾貴游何為者豈問長安米增價不思射虎南山邊自逐鷦鷯蓬藋下題金華莊元善松澗圖南華老仙骨不朽古屋山深大如斗平生傲晲不出門屝屨無絇衣露肘長松千章手自植繞屋蛟龍蟠白日松根老澗石髓浮環佩鏗鏘委寒碧長風撓松松怒號澗聲回合驚奔濤莊生聆之發長嘯倣佛相從時數邅茅簷夢起午忩靜碎攪龍香濯秋頴澗聲繞指松氣浮一片溪山曉無影我方覽之窺出處黃塵帽簷汗如雨期君歲晏斸茯苓共汲清泠帶雲煮梅邊齊道人心與太極會結茅直與孤根對捲簾秪在香影中開户獨當霜雪際我聞老逋湖上宅老樹團團春拍拍巡檐時復索一笑野月髙標鬬清白何如道人屋如斗蒲團祗荷南枝右定回但見影滿窗羣咡暗聞香逼肘嗟豫生平懷此癖雪後蹇驢時一策繞花哦作清苦辭每欲及騷追楚魄道人心骨如花清歲寒我亦當同盟擷芳煮鶴作清供竦身端合歸蓬瀛題張子文耕隱城市紅塵一千丈轕利膠名騁輪鞅經綸往往隱屠釣自謂勳庸隔霄壤野人只住城西隅舍南舍北皆菑畬東家襏襫許借我一犂春雨耕烟蕪婦能曉饁子能讀一畝桑麻生理足但願登平樂有年肯為馳驅謀食肉歷山已逺有華杳出處當年計非小君臣各與時際㑹聖德于今麗穹昊張君隱志非隱身秫香釀得秋風醇擬續豐年頌元德醉歌願作勳華民張正卿芷石圖蓀蘭蕙茝元同譜零落湘纍雜煙雨香聫老樹氷霜姿靜倚雲根鬬清苦紺葩同幹晴縣縣嶄嶄𤣥璧大比拳根通九畹自倣佛翠結五嶽同連蜷四明張君好事者求得仙毫一揮寫至今清思滿沅湘夢拾驪珠月中把芳聲從此如芷香貞心從此如石剛願挹髙標脫凡俗擬結金蘭共徜徉嚴景安壁上盡松次韻天風吹雨來滄溟霹靂下震龍盲驚巨靈怒拔千兔秃老龍蛻此槎牙形致身自合倚絶壁底向虛堂寄靈蹟龍香攪翠秋淋漓老幹摩空天咫尺當年觸石誇共工天柱夜折嵩髙中大材不作棟梁用秪恐斤斧終難容遂令根盤多錯節安得吳刀秋斸月㑹須斬伐登廟堂留取君家壁如雪白日行簡仲幾白日白日復西墮山中客子樓上坐樓西青山曲如拳樓東青山翠成朵讀書到晚心悠然故人别去今經年江流到東不百里夜半欲上山隂船故人故人在何許半間茆屋青楓渚秋天有鴻江有魚胡為使我心獨苦白日落盡我思君夜凉望斷江東雲題張惟中翠微圖贈嚴侯將軍間生東魯質半生雅有愛山癖自從一登泰山上下視羣峯如蟣蝨邇來築室鏡水湄萬壑千岩走空碧躋扳不假山行樏興來每著登臨屐一自佩符東海上屢有此癖橫胸臆四明張君好事者為寫新圖慰疇昔寸毫自解藏萬機跬步應須論千尺將軍獵歸卧窗几數覽斯圖興太息翻思往事如夢中不覺心神愈滋疾未容北窗卧淵明政擬東山起安石他時談笑安黎元好住翠微恣盤逸方今事業當激昻願䇿崇勳紀新蹟題灞橋風雪圖長安雨雪大如甕馬蹄曉蹴東華凍長安雨雪大如掌磔磔商車競來往先生名利兩不干騎驢底事衝風寒風髯獵獵雪種種三尺蹇驢僵不動自知清骨為詩瘦不道玉山和雪聳君不見長安有客似龜縮夢魂不到山隂曲陶家風味党家奢煮茗烹羔總庸俗清標何似襄陽老一片襟懷自傾倒只因灞橋覔詩忙非是長安被花惱豪吟往往凌鮑謝長才靡靡壓郊島載披毫素眼生花悲吒無端動清昊題陳君適凝翠樓北山靚窈南山幽山中有地如麟洲道人平生好樓居看山一月不下樓素心肯簉鵷鷺侣雅志自與麋鹿儔樓頭逺峰曉潑黛樓下急澗晴鏘球紅塵萬丈飛不到坐覺眼底蒼雲流道人論心亦好客有爵無算常獻酬秪今江海事兵革羣縣供給方旁搜何如樓頭􅖏門坐免使調發窮徵求歸鴈商飇鳴秋衆木脫鴈鴻來作南州客不辭雲漢涂路長要識吳淞水天闊異鄉雖云足稻梁江湖實恐多矰繳同來兄弟無半存强爾相呼整歸翮東風杳杳吹晴沙此日一舉天之涯羽毛不犯塞上雪曈曨豈識江南花洞庭一聲夜漂泊瀟湘倒影春橫斜長安故人斷音信一去十載忘還家鴈乎鴈乎爾歸何太急使我臨風增歎息題諒上人巢雲閣上人身在虛空住鐵杖芒鞋踏煙霧歸來塵土二十年滄海桑田幾朝暮石林紺氣春浮浮翹然結屋居上頭鷦鷯一枝亦自足老鶴萬里空相求上人閲世如幻境空翠滿身凌倒景五更風雨老龍歸至今尚覺袈裟冷上人是客雲是家雲與上人同一涯手把揮拂上天去一洗四海無塵沙送雲上人孤城秋老萬木隕夜夜秋聲到危枕長遊政有山中人振錫時當菊花近紅塵如波渺滄海滄海紅塵幾更改上人閲世如浮漚頭顱只有詩瘢在錢塘近可一葦航鍾陵王氣連鬱蒼鸞翔鳯翥久銷歇龍蟠虎踞今悲凉上人視身如電露自謂無來亦無去人間興廢等如之只合編茅在山住送全上人蜀中山水古所聞知有五嶽元非尊上人足跡半天下錫端髙曵衡湘雲十年掛錫東海上金峨雪竇晴相向燈分舍利塔畔光鉢共旃檀林下餉上人歲晏將何如手持徑寸摩尼珠劇談似訥訥不訥外貌如愚愚不愚上人此理知默契所以不㑹唯深會二嚴二乘妙熟探大千小干了無外南還欲鼓湘潭柂天地江山等么麼自知浮世一化城願結跏趺面牆坐題姚子章野航我家雪舫大踰屋君家雪屋寬踰舟四窗團團夜如水月明滿載無人收道人書聲夜半熟一襟清氣清於秋我來叩舷歌白雪隔江老樹春浮浮
