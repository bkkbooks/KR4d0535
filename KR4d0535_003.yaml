body:
  text: 子淵詩集卷三元張仲深撰五言律詩宿單孟年溪齊次韻蘇端元有約風雨亦來過曉市魚蝦集深秋笋蕨多交情今管鮑詩句逼隂何最喜華顛祖孫兒似小坡題天師畫送人還洞庭金碧擁層巒歸橈趂急湍人從天際去春在畫中看驛路隨江盡湖雲類海寬停舟未可别風雨落花寒答仲幾見柬韻小室俯江渚晴新愜賞心半年如許别此夕動孤吟書至燈花落春歸栁葉深懸知明月下獨步在湖潯江城雜詠七首望逺孤城暮村虛樹木稀故山元有約此日未忘歸沙晚鴈聲起江寒天景微平生蕭散意莫遣寸心違西風滿天地行子夕陽前南浦人爭渡清江夜有船異鄉孤客淚隔竹小家烟風物今如此登臨一惘然十月風霜徑長空鴈正愁不辭關塞逺故作稻梁謀影落橫塘北聲寒古渡頭羇人耿無寐危枕在江樓原頭數楊栁葉盡晚依依嵗晏北風徑天寒行旅稀江鱸從網得水鳥逐船飛漁子津西去黃昏得酒歸方冬氣候變縱目意凄迷千里兼吳越南州帶鼓鼙地連江棧闊天入海門低歸路何愁寂寒城鴉亂啼霜空淡孤月此夕十分清烏鵲寒無夢關河夜自明入簾微影落開户素華傾萬里還如許姮娥不世情霜露下林薄江干嵗事闌起來風力惡不放酒杯乾南土旌旗滿孤城鼓角寒百年如夢寐頭黑好相看金華雜詠六首經年困行役鬱鬱若為情異縣青山衆新秋白髮生詩魔降戰壘酒陳破愁城物色今如此漂流不為名百曲浮梁上滄波午景齊亂山藏四縣一水滙雙溪舟逐鸕鷀下沙迎草樹低隔橋秋社散歸客醉如泥佳期天上又星約喜重尋是嵗閏七月明月孤城柝西風獨客心故鄉千里外歸夢一溪深應想髙堂上新芻亦自斟久客經春夏風清尚坐留樓頭延月滯樹杪見星流東土登平嵗西疇黍稌秋山妻應解事麴蘖已吾謀客倚南樓上西風月又初紫簫閒度曲茅屋夜溫書風物吾鄉似人情異縣疏既無升斗絆只合賦歸歟浴罷披襟坐危欄曲曲凉秋風清枕席客思入江鄉亂竹疏螢度深林衆鳥藏晚來閒物色風土似荆揚游承天寺秋色今朝盡西風落晚紅人心本無隔節序不能同杖策孤村外齊居亂水中坐看馳騁者行李自忽忽練川雜詩四首風物皆遷次因循嵗月過清池黃葉滿落日暮雲多蠻海橫妖祲官軍荷鎧戈故鄉音信斷無路問如何百年全盛日海角見風波潮勢秋逾惡村舂夜有歌時豐多黍稌日暮飫駕鵝幸遇登平嵗搴旗聽倒戈浮世如談夢人情似聚沙一年江海上千里問音賖驛路通西市江聲入下砂客懷無可遣時復嗅黃花江深風物異歸計每逡巡有酒愁難破吟詩興自神枯萑晴似雪獨鶴夜如人遁世當無悶行藏一任真酬姜朝宗見寄韻三首山色迎人近西風逐客來隔林松子落遍地菊花開補衮慙無策論詩屬有才江南多蟹稻相遇且銜杯霜楓圍别院烟草亂蒼綦久客懷三益論心擬四知浮生波上梗世事橘中棋坐歎知音少慿誰覔子期未赴龍門險安知蜀道難勳名懷魏闕身世屬槐安烏帽西風側漁村夕照寒黃塵三萬丈無計一彈冠用韻酬余伯庸三首西風吹練水凉意襲絺袍擬草張衡賦愁聞楚客騷旅懷秋更惡歸舸月中操應歎浮生者巢由亦自髙烏紗籠短髮渾欲不勝簪落景增詩思秋風識客心潮平江浩浩月上夜深深不道人無寐新蛩四壁吟短褐勾吳客風流憶晉賢斯文今尚在故墨有誰傳野寺門如市田家屋似船飛螢偏有意時照筆床前酬江叔載見寄韻三首射虎南山側風吹短短衣故人浹旬别今日五雲飛春動梅爭放霜晴魚正肥懸知賢伯仲醉卧月中扉異縣無家客惟愁卒嵗衣年餘三日在春入一鳶飛溪水深如淺梅花瘦不肥扁舟時有興莫掩雪中扉元日雪如泥山林玉作衣栁梢春尚淺香絮曉先飛顧我鄰無蹇知君廄有肥而還許借我一策到山扉寄樓仲幾一日一相見百年如此不已知詩有趣未放酒忘愁鳥下西鄰樹月明今夜樓相看須白首投老共林丘訪鄮山周致堯時楊彥常烏性善蔣伯威陳子參軍聨句因次其韻紅樹風霜重𤣥冬氣候深幽人喜還往好客足期襟酒陳圍詩壘詞鋒逼羽林江湖千古意今日友朋心遊越撫跡悲生事因循作逺遊半生山水願滿眼古今愁木葉經霜减山雲遇雨稠晚來清興動步屧到林幽茜涇莊上人以詩招飲用韻答之别院圍琪樹風聲起繹騷暝雲連古寺老客擁新貂零雨妨歸計幽人屢見招西山如有約何必上凌霄清江三日客風色晚騷騷古寺催嘗酒詩人免解貂永懷方外友時見雨中招倣佛蓬壺路何須問紫霄早秋六月商飈動光隂逝莫留小忩梧葉雨危枕竹床秋逺浦凉雲薄孤村野水流去年為客日今夜在南州曉起曉起坐南牖尋詩可散愁江城三日雨天地一分秋斷岸蘋花亂空江鴈影浮西風清興逺倚遍夕陽樓嚴子迪南宅宴浦上南陽宅人竒似小坡論交雖未久厚誼許相過江暖眠鸂鶒霜威振薜蘿齊居具薰茗無夢到南柯梁湖孤舟催曉發急水暗前灘行子羇離日𤣥冬樹木乾霜清天宇闊山盡海門寒回首通明路梅花屬我看即景三山何所見衆木集珍禽流水自朝暮青山無古今飢鳶立檣杪孤客發春深江海多詩思愁人懶獨吟破寺破寺依山杪平湖繞四圍霜風吹客鬢水氣濕人衣漁舸鳴榔急吟篷載酒歸晚來閒物色坐覽嵗華非行旅行旅驚秋莫征衣㸃越霜絶葷神氣爽得句客情忘廢沼枯荷滿空庭碧柚香起來羞把鏡維恐鬢毛蒼天際天際殘陽薄南濠水氣寬生涯牢落久江漢别離難明月漁歌起孤舟客子寒梅花隨地發聊以破愁端北風北風振枯木殘葉苦禁持起覽窮冬物因懷生事悲疏烟淡西舍寒雨響枯池陳酒床頭有題吟飲一巵嵗盡無家千里客此日若為情異縣多風雪殘年見甲兵梅花因我笑山月為誰明照我鄉關夢相隨到鄮城懷兄子益莽莽草根白昏昏林表烟半村猶作客橫浦有歸船晚嵗霜如雪離家日似年何如聚兄弟團坐夜深眠歸夢歸夢逐飛鳥修程奈爾何澄江饒浦溆落日亂駕鵝近市浮圖小還家客艇多裁詩且消遣隨意發髙歌歸途歸途才五日曉起每心驚溪響知灘急霜嚴信日晴漂流幾半載蹤跡愧吾生先到西湖上時還訪舊盟行舟舟行常可計風色苦相違落日酒杯濶清江蘆筍肥壯懷兹浩蕩畢景自稀微眼底非無見遙空一鳥飛九日憶昔殊方客故鄉千里情何如杜員外瞻眺梓州城老圃黃花在西風白髮生床頭有新酒㳙滴盡餘傾海角孤城晚驚心嵗月馳小園楓落日老圃菊花時愛酒陶彭澤能詩杜拾遺百年須强飲頭白莫深悲
