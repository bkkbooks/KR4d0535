body:
  text: 子淵詩集卷一元張仲深撰五言古詩古意三章美人擷秋華英英照秋水人好華亦好光輝兩鮮美臨風悵離居願言寄君子蜚蜚天上鴻圉圉水中鯉浮湛兩茫茫心懷淡無似石間見明月貞心諒如此西鄰有處子蛾眉妬陽春見月不敢窺見華不敢顰吉徴未云卜秉心守天真永保心不渝但恐色易淪它時事君子白頭宜相親蠢蠢八育蠶颯颯二葉桑桑飛蠶亦老婦女絲在箱天寒響機杼嵗暮供衣裳物晚終有成逺為君子將但願君子心遲莫毋相忘雲文閣我家住蓬萊結屋俯翠瀛平生好樓居坐有安期生雲連香爐峯宛若橫江鯨老蜃喣晨氣瑞靄疑縣旌倣佛王子晉緱嶺調鸞笙光芒貫東壁可玩不可名常恐青藜煙夜夜連西清題淞江夏伯和自怡悅齋髙人稅塵鞅嗜此林麓居空翠眩微旭石氣陵玄虛淑景祕莫測協風與之俱燕坐淡忘慮素懷亦自攄外物豈我嬰內境默有愈所以君子心廓然彌八區願持濟時術與雲同卷舒起作邦家霖坐見民物蘇窮固自怡悅達使俱歡虞作詩慰髙人此意將何如東臯踈雨夜來過曉澤淡不波南飈亦時臻我行此婆娑十日在州郭炎塵漲城阿茲晨入山去崩雲壓藤蘿欣然酌我酒慷慨發悲歌勳業在少壯老大將如何題鄞尹許具瞻仁政堂郎官宰百里列宿昭穹旻自非操至公涖此常邅迍王臣殊謇謇聖語斯諄諄所以翼流化啓沃需臣鄰許侯秉純粹積學夙所珍一命倅州邑載命撫字勤眷茲膺遴擢居然宰東鄞絃歌振庠序治教超等倫一堂雖云舊景象由兹新草木足生意鳥雀亦自馴向非公明懷動植焉陶鈞雲霓士民傒雨澤桑麻勻終年去炎凛百里皆陽春明溥鈞無私細大同一仁願持金石心明當贊經綸作詩匪誇詡巨筆行鐫玫文昌春祀宴集分韻得文字璇霄霽靈雨澄波蕩青雲玄宫集逢掖稽首宏仁君蘋蘩春薦羞鬱鬯沃芳芬祥光爛昭昭肸蠁來熏熏諶馮祝嘏致禧藉腥爼分歡悰互酬獻讜議殊紛紜新題席上命好鳥花間聞此樂誠未央此會不可羣先逹固崇仰後覺心彌勤黽勉答神休千祀昌斯文又丙申二月祀文昌分韻得忽字祠宮懸宿靄藏祀肅趨謁飛蓋晴雲褰委佩清香發灌􅌊闡精誠神靈儼飄忽髙堂欽受均行厨富肴核藻景緣壺觴光氣薄靈樾醉躡青雲梯相期上蟾窟過太湖漂漂適他州浩蕩去無所風飄如驚鴻百里已可許天寒吳江波日落晉陵渚旅懷慘不悅愴悽恨如雨獨夜維我舟三更有鳴櫓溪上晴曦朝可負溪水渴易求值茲艱苦際幸免寒渴憂所憂楮幣嗇難為稻梁謀紅塵冒川陸挈家往山陬蕨芽暑可斸溪毛夕可羞渴飢既無慮溫凊宜常周團圞坐初夜題吟散間愁杜門候時康終期闡皇猷白雲閟崇岡須臾無定期好風從南來吹渡溪之湄溪流既靡靡雲影自離離而我造其間偶此相娛嬉坐日景將夕徘徊淡忘歸烏鴉忽飛來足我山中詩臨流坐白石少憩聊盤桓隔溪兩黃犢動靜天機間物我俱夷遊偶地心自安山中三日留展我平昔顔明朝出江口孤舟入西山蛛網落花繁紅隕晴風欄絲自成聚鮫綃涴紅淚氷蠺貫香雨逝將流水心縈此愁幾縷日暮燕支寒春深聞杜宇城南分韻得山字白日何杲杲浮雲亦盤桓悠然百慮息愛此一日間放舟沉幽渚擊楫回清瀾我性本蕭散茲賞有餘歡水花自嫵媚煙鳥時一喧吟餘不知暮夕陽度西山城南分韻得底字清風吹我舟搖搖河之涘我來憩林塘林塘幽且美竹踈風冷冷雨足禾靡靡尋詩陟古城醉酒㺯清泚悠然樂有餘浩歌白雲底余辟地城南友人單孟年項希周相過分韻三首各次之楓字韻貴遊不垂堂金屋春融融飫知膏粱味鄙我田舍翁凌晨轉泥坂薄暮披榛藂種秫秋可釀澆此磊磈胸但憂貸二稅詎知有三公夜歸藩落內曉入州縣中徴求苦給給奔走常忡忡風塵翳白日江漢號悲風中原戈甲滿晚嵗霜露濃貴遊厭膏梁誰復懷宸楓晚字韻幽居邇城郭十往常九懶林泉有真趣聲利豈吾挽挂巾松樹枝履屐莎草坂嘉朋忽枉顧頗怪情意坦世途屬多艱交態常赧赧過從在知巳居敬自行簡青蔬嫩膏腴瓦爵踰玉瓉相看未白頭且復作青眼道路終坦夷琴尊當往返歡迎在今日論交未為晚林字韻紅塵眇川陸旌旗駐彌深詎為白石歌擬作梁父吟抱琴謝俗駕清坐懷知音良朋喜簮盍濁酒欣對斟歡言情眷眷景仰心欽欽世方貴趨勢我儕自論心安得起山王酣嘯坐竹林西江放船亭午進我舟西江煩屢渡野盡青山來日落帆影去寄身江海間俯仰嵗月暮悠悠發孤咏政爾湔百慮萬事已復然滄江自東注秋泛分韻得影字畢景進我舟褰裳涉幽境盈月耿白光長松落踈影菰蒲晚瀟瀟水天秋冏冏歸來酒興髙歌長夜初靜張德淵飲豫金櫻煎酒作詩乞之南州産竒卉叢生翳山澤密葉細如錢修條亂如棘遲遲青春深粲粲素華發微芬嫓崇蘭幽芳媚晴雪繁霜隕髙秋纍纍綴朱實道人有佳致戒童秉筐笈采擷溪之湄製煉良有法渠渠杵百過冽冽玄霜滑上引瑶池漿下爇琪樹葉清芬何輪囷百沸嬰執熱有如連金泥芳鮮敓餳密置之尊爼旁情親為豫出一酌堅玄髮再飲生羽翼久之澤肌膚矧乃祕精血逺慚銅掌仙清露粲玉屑願分刀圭餘終朝蛻凡骨送染上人往永嘉禮源師人生始提抱孩笑物罕儔三齡蒙始達五齡氣食牛弱年漸乖張役役各有謀或為工與商騁智窮輪輈或為士與農讀書事田疇所以嗜名士實與嗜利侔陽輪駛隙光衮衮無停留朱顔謝韶景白髮生清秋乃知人有生百年等浮漚生前爵九命死後土一壞阮生悟茲理離俗仍長逰東嘉宅山水源師道之尤往參一小乘智辨從茲優解此身世紛反為身後憂子今别我去同難難同流彼此尊所聞茂業期精修永玩平堤瀾源頭自悠悠蘭溪曉發鄉頭灣十里見州治長橋卧秋虹古柏翳寒翠行行問風俗人煙稍繁麗所産皆可人頗與鄉土異溪魚帶雨肥紫藥經霜膩一一供盤飱似勝鱸蕨味清醑冽且芳紅粧冶而媚安得五石尊飲我干日醉回首終殘年客程誰復計石壁寺俯首見清流仰首見石壁上有蒼茫䀶積此太古色雪霜摩其肩波瀾濯其足自從有天地即解有此石屹爾嵗月久不逐浮世易至今肆頑礦洪濤恣吞蝕央央石上雲雲開絢晴日中有梵王宫翬甍爛金碧墻垣繚周遭一覽慰平昔何人手種松苯䔿才數尺期汝千斯齡下與蒼石匹但恐陵谷變漂泊兩相失呈僉帥明時尚右學髦俊各有造廟堂足旁羅山林極幽討公家秉懿德胸次五車飽精神掞空碧符采絢華藻當年覲宸旒啓沃邦家兆居然宰州邑撫字弗草草棠隂護晴晝燕香散穹昊滄海一駐蓋馳聲被夷島輕車駕熟路玉帳罥清曉參謀語堂堂籌畫氣矯矯政事刀發硎溫恭圭襲繅烏臺茲振佩七郡盡驚愀賢良賴登庸姦回幸深勦書生仰星鳯瞻拜苦不早髙堂抱真素白髮已垂老願提五色筆鈞陶藉吾道俾紓人子心捧擊自傾倒洪恩曽靡忘有如日皎皎需公職補衮調燮計非小他時安黎元撫掌談笑了越上九日感懷七首呈韓明善先生霜橫江上秋月照天外海政兹風景遇客子顔色改異鄉難為情賴此清尊在央央黃金花幽姿自瀟灑世無彭澤翁千載誰來采耿耿嵗云莫索索多悲風孰云客窗靜亦有床下蛩起來獨盤桓幸此良景逢油然開我顔清賞誰與同濁醪有真趣可惜兒女容行吟會稽嶺坐嘯蓬萊峯冉冉羣動息月在山之東登髙曠玄覽寓目銷我愁峰巒滴朝潤蕭條氣含秋客邉得佳莭慮靜境亦幽况乃嵗稔登遺禾彌道周糟床注新釀已免沽挈憂幸此足斟酌好景庶可酬豈知故園月今夕在兹樓一笑欲忘言嵗月何悠悠越山鬱岧岧越水何涓涓愛此山水區征途滯青年蘭亭訪陳迹俯仰追昔賢繭紙匪故墨千載空遺編引流泛羽觴一醉西風前雅量斟酌之浩歌陶自然褰衣涉清流興盡足未倦杖藜訪林丘荒塘衰草遍客中恨寥寥及此情眷眷為采籬東花寄彼山隂彥歸歟復歸歟浣筆書所見愛酒古所有我性亦自耽匪為酒作荒奈此風景繁旅况政索莫庶用除心煩蟹螯薦新釀霜橙壓黃柑心交可酬酢豈為事盤飱三嘆尊爼傍身在天東南亹亹圓象運苒苒青嵗闌䇿策西風鳴耿耿客子寒客子行路難况乃衣裳單萸盤薦重九雅歌和清彈黃華被幽徑拒霜明空園所樂忘所悲慷慨有餘歡不知烏帽欹邈矣追龍山避暑湖上與吕元膺分韻四首我行湖之陲浮遊𣪚腰腳殘陽度西林啼鳥滿東郭褰衣受微風此計良不惡嗟彼灸手徒于焉孰為樂長謡踏歸徑流螢滿叢薄流水本無意歸雲亦無心人生苦多機擾擾懷悲辛何如命佳侣濯足湖西潯悠然忽忘言嘉木鳴珍禽起拂塘上石坐愛雲滿林行行足力遒少憩湖上松坐拂松下石永嘯生清風嗒然滿幽聽萬籟真笙鏞欲覔不可得白月當青空揮手謝時俗去卧東山東但恐屐齒折政茲懷謝公三伏苦炎熱林塘自蕭幽長松蔭平湖六月如清秋水花靜窈窕煙鳥時唱酬携朋薦桃笙戒僮汲新流盥罷吟我詩此樂復奚求安得陶元亮于茲共盤逰題衛明鉉溪山獨步圖次韻輕舟艤幽渚載酒欲問竒穹巒浥朝潤老樹含秋暉意行入寥閴山回轉參差無琴寫深情有酒一中之覽圖愜懷素坐玩殊忘疲世途方蹇蹇願我常怡怡俯瞰滄溪流仰視白日馳安得陶元亮抽簮賦來歸倪仲權宅城北隅鑿池植蓮環以翠竹友人烏繼善顔其齋曰花香竹影蓋取慈湖楊氏之言曰花香竹影無非道妙因賦十韻幽人嗜清謐結廬池南濆生意浮緑野波光蕩青雲竒葩既嫵媚修篁亦繽紛繁紅藹晨馥翡翠護夕曛物雖一植微中有至賾存形色理固顯索隱邈見聞妙契俯仰間鳶魚亦翔奔乃知動植者至理同絪緼玄功諒誰宰物物均化醇玩此香影妙嗒然難具論金華洞金華古洞天丹霞冠其顛上當婺女垣下據雙溪壖括峯盤其股會稽摩其肩晨霏護瑶草瑞靄緣石田靈宫嫓上界隂洞通九天黃冠秀玉飄琴心語胎仙駕言極遊覽捫蘿重攀緣素心愜清曠探索窮幽玄長揮訪松喬授訣期長年邈焉不可究澄心聽松泉赤松宫桃源富山水仙居鬱嵯峨穹巒逼象緯紺霞護藤蘿羽流戴星冠方曈照皤皤或時凌紫氣環拱聲相和世傳平起輩飈輪振瓊珂遐登隕遺迹石羱滿山阿逈與塵世隔巖罅豁臼科遺兹幻化境伏物皆駢羅我方借筍輿一覽愈宿疴竟欲從之遊恐貽來者呵釣臺嘉林冒晴碧穹臺薄層霄央央太古雲停隂被山椒炎薰駐行鷁捫蘿撫岧嶤激烈增慨傷顧盼忘曛朝赤靈復乾符雲臺紀崇勞至人淡無為寡處窮盤邀未論夷齊清寧許巢由髙舉世縻聲利驚寵趨市朝黃塵競汨汨銛口紛囂囂有如車下坂覆折隨所遭仰企臺上雲清風振林臯我方規出處遐瞻送長謡通濟橋浮梁駕長虹溪流浩無極眷兹締構功諒哉殫庶力崇欄護滄波修棟走白日巨砥纍十尋瓌材逸千尺靈鼇負屭贔老蜃吸業岌念昔病涉者憧憧今有適浮屠廣私恩逈踰溱洧迹期爾千斯齡永永如砥直慨彼巖廊姿駢列皆柱石顧維通濟功安事作舟楫宿寶華庸上人房靡靡日西頽寥寥夜將入我來何所見沙尾白鳥立渚華散幽馨岩月落佳色支笻入招提修廊響吟屐林堂有餘興危坐忘形迹野鶴投暝回踈鐘度蘿出朝來借筍輿去踏清溪石宿慈湖石上人房曉鐘度東壑客子酒方醒殘燈耿疏窗西月淡孤影偶地成安居澄心愜幽境風松響簫韶危枕滿清聽餘音久回復鳥啼山更靜杲杲日東升歸心又馳騁過小洋我行甫三日所厯不絶山隔溪見崔嵬地險心自安五里逢一汙十里輒一灣篙師欲一上若挽百弩艱有如嗜名士分寸勞躋扳常恐一失勢隕此千丈湍覽此已長喟所見恨心酸驛騎轉山腰客舟泝危灘意興各有適風霜共摶顔去年梗蠻獠炎塵塞閩關羽書日夜下已見剔巨姦會將鏟疊嶂免使行路難送王正卿歸隱東湖分題得釣石蒼巖鬱峩峩滄波靚涓涓水山藴靈秀人物儲清妍步尋釣石處撫迹心油然逹固登巖廊窮當處林泉未論磻溪髙尚友羊裘賢江海多風霾洪濤政滔天抱懷砥柱姿容默思自全嗜此水山嘉盤遨送流年坐拂石上雲永嘯清風前贈吕自牧玄機運亭毒沖氣萃厥躬靜抽造化祕周流與天通燮調或少沴刀七每不供所以針砭妙巧于藥石功吕君吾鄉彥藴奧蟠心胸冥傳越人術訣授長桑翁秉此濟世誠往往蘇疲癃良時解醫國此理諒擴充明當馳薦剡籍貫明光宫送恂上人遊徑山用銘禪師韻圓穹運亭毒大塊真浮浮人生於其間有如一虛舟乾坤鬯清淑可攬亦可收恂師擷其秀南林嘗獻酬竟上盤陀峯時與金仙遊亭亭峯上雲泛泛水中漚雲飛漚亦散雲在漚還留覽之如忘言松風奏琳球幡然動飛錫暫卓西湖幽我欲往從之離俗真罕儔長揖别師去同調難同流感懷流水清泚泚停雲白英英兀坐玩時物嵗月如奔星芳草歇柔緑秋花發幽馨悠然上南樓迢遙暮山青涼飈起木末鬱鬱方含情清晨攬衣起逺林瞰朝暾嚴霜淨天宇碧水收舊䀶愴此景光徂嵗暮驚心魂安得故人遇聊亦對清尊如何咫尺天令豫思徒紛宿廣夀方丈澄州漲春濤徒杠晚先登偶携寰中友值此方外僧歡迎慰平昔邂逅云吾曽杯盤雜蔬果起坐飛籌觥新詩紛綺麗妙篆焚晶熒糟床夜深注茗碗更餘烹論交意自愜晤語心先傾竹林振清響梅花為余盟良會欣在兹四美今合并雅興誠難窮共看無盡燈秋夜讀書西郊風露夕涼風入吾廬焚膏繼晝晷而還讀我書簡編散藝香探索味道腴玩此聖賢心油然樂有餘四郊久多壘兵戈政馳驅紅塵障白日積胔填溝渠安得挽天河為我一蕩除且當􅖏衡門兀兀究聖謨石塘霜日浮晴暉溪流眩五色石髮結深翠團團異瓴甓或似丹與堊或如紺與碧素沙相蕩摩滄波互吞激緬思瀫溪上五里時一折故為此經行咫尺見懸絶乃知世途險愈逺勢愈亟行役且勿論尊酒聊自適霜橘大踰圍溪魚動盈尺勿辭酒味薄庶可澆胸臆酒酣詩眼放落日半天赤盆荷南庭蔭嘉樹日夕生清風幽曠愜懷素繭足三支笻戒僮斸玉華陶埴空莎藂分此太華根擢蒔茲盆中竒葩既嫵媚修莖亦玲瓏雖隔土壤脈實假造化功太虛落景圓涼月光溶溶深夜藹芳氣晨露凄以濃鑑湖千頃秋茲意亦自同眷言嚮君子百世濓溪翁送陳子山待制戒舟滄溟濶挂席北斗回驛吏候明發夙興具盤罍及兹陽春杪髙飈正南來蛟亹海色聚秦望霜霧開迢遞啓城觀縹眇幻方萊玉堂席虛右羣仙久裴徊冠蓋切五雲環佩振三台直起鈴閣曙臚傳重轟雷聽薑可玉彈琴用江叔載韻出門聽松泉塵心一以洗入門聞絲桐又欲洗塵耳幽人在東齋見之殊可喜悠然太古心靜探玄精理一㺯風泠泠再㺯溪泚泚但言少知音振衣張拱起孰知伯牙心蕩蕩在流水豈若齊王竽僅諧東里鄙芝蘭室沅湘翳風霾畹畝荒雲煙芬芳既銷歇蕭艾彌郊原亦有好修者雅意趨自然結齋僅十笏度地踰九筵房櫳和煦藹几格生清妍我來承顔宇靚若挹芷荃清言復同心晤語情便便至今暮髙潔日夕懷林泉擷芳持贈逺長空渝嵗年凝思淡無窮寫入琴中絃秋日海棠露華曉厭浥草木凌凄風值兹搖落際覽此翡翠叢葩葩曜秋圃灼灼騰春紅嗜此明媚姿不減睡思容誰當秉銀燭穠艷欺芙蓉雖憐若質嬌孰御霜華濃永嘆三徑前盤桓撫孤松靈源寺蕭梁崇象教祝髮布中國偉哉樓約師江左闡翻譯宸旒躬授記龍衮致齋飭胡為且示現大千茲卓錫尖峰殿其後靈源徑其側精籃鬱中峙金剎屹千尺皇畿會蒙塵乘輿據傾革尚想瓶中天借爾護持力我方眺遺境慷慨興感惻秋風振祗園荒陵共蕭瑟用韻酬易之翳翳景向夕樓臺結微隂涼飈東南來好鳥鳴髙林懷人眇天末跫然想足音泛舟出門看青山迓此千里客東臯載我舟搖搖入州郭日暮江流長坐永天宇濶悠然增偉觀變化何倐忽雲度山尾青雨灑江面白神工不可測片月水中發九月菊未花西風落秋杪零雨冒江郭起行眄中庭支笻慰寥寞籬東菊婆娑欲采未盈握竒英藴黃中清芬含翠萼去年秫稔登佳朋足斟酌對花發長嘯吟咏殊自樂今年風塵際干戈滿川嶽居氓盡逃亡朋知半零落對花發三歎撫景恨詩惡何當起淵明吟詩檄華發窗間水影鍾仲章見示小室俯晴渚麴波曉晶熒陽靈濯光景空碧生虛櫺誰持并州刀剪碎龜甲屏羅襪塵縹眇翠袖春伶俜夜深煙霧濕常恐埋青萍
