body:
  text: 提要子淵詩集六卷别集類四元臣等謹案子淵詩集六卷案子淵詩集散見永樂大典中但題曰元人文淵閣書目載之亦不著撰人名氏考集中有嵗盡詩云照我鄉關夢相随到鄮城鄮故城在鄞縣東唐時析鄮置鄞慈奉鎮四邑𨽻明州元為慶元路納新金臺集有懐明州張子淵七律一首又有依韻奉答子淵七律二首今唱和詩俱在集中韻亦相符則當為慶元路人又鐡釜中蓮詩題下自注叙同時並賦諸人有暨仲深之語則其名當為仲深又有懐兄子益在横浦詩以其兄字推之則子淵當為其字矣集久不傳兹分體綴輯得詩六卷多與納新楊維楨張雨危素袁華周煥文韓性烏本良斯道兄弟唱和之作而納新為尤夥古詩冲澹頗具陶韋風格律詩雖頗渉江湖末派格意未髙然五言如曉市魚蝦集秋山笋蕨多驛路随江盡湖雲類海寛地通江棧濶天入海門低明月孤城柝秋風弱客心枯萑晴似雪獨鸐夜如人七言如江村夜迥傳金鼓池館秋深老芰荷滿面炎塵低客帽一川離思屬荷花家僮觧事故携酒野鳥避人低度墻北風吹沙弓力勁落日照海旌旗寒秫荒乏釀茶為酒魚熟難賖米當錢西江返照連虹影南鎮殘山入鴈行亦皆楚楚有致其見重于當時名輩亦有以也乾隆四十六年九月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀原序昔唐杜子美於開元大厯間以詩鳴其忠君愛國之心一形於言故後以詩史稱焉余識同里張君子淵於童丱中知其明敏嗜學蚤孤事母以孝聞後十年余教授徴饒間子淵亦澷逰湖海正諸有道以擴其所藴故其詩章累帙凡愛親之誠形之于言當代清要轉聞于朝而旌其門吁子淵可謂共為子職者矣然詩之為詩豈徒然哉自風雅頌而降楚漢魏晉沿于唐宋體製不同各言其志莫不有揄揚風刺之道焉今子淵之詩拳拳不㤀乎親志形于言自有不能已者子淵雖未能拾一第承一命以榮其親獨能以詩彰其母之志節亦榮矣然詩之馴駁固未暇論其愛親之誠較子美忠君愛國之心庸有二哉觀子淵之詩者各能興起其愛親之心則於名教信不為無補也嗟夫采詩觀風其職已廢他日有求忠臣於孝子之門者舍子淵其誰歟㑹稽王君良與鋟梓以廣其傳余既服子淵之孝于親又嘉良與能樂道人之善故書以弁其篇端至正丙申春三月庚寅四明安晚後人鄭奕夫景尹父序昔者楚王之弟鄂君泛舟於新波之中榜枻越人擁棹而歌朱文公以其自越而楚不學而得其餘韻聲詩古今共貫四海一家有非人之所能為者雖其義鄙䙝而君子取焉他日郭囉洛君易之至京師常言張君子淵之賢出其詩若干首其古意三章託興深逺忠貞之心盖莫可掩有諸内形于外即是詩可以窺子淵之存矣子淵越人也由其詩觀之越之為越豈不異乎古昔哉鄞故越地至于近代遂為文獻之邦宗公大儒前後相望子淵生于其鄉一掃其鄙䙝之辭所謂魯無君子斯焉取斯宜乎易之稱之不容口使朱氏見之又將何如其喜也余往至鄞子淵羣從昆弟數相往來知其嗜學之䔍張氏其興乎暇日讀子淵之詩輙叙而歸之易之至正十二年八月丁夘臨川危素書于金䑓坊寓舍繇百數十載已前北南並尚眉山值建學大興詩人殆廢永嘉專意肅括姚賈幾中興其失也萎江西諸賢以直致為工斷續鈎棘自謂無首無尾世復以率􅅓之暨車書混一遡淮而上號呼縱恣啁唧之音不革於南俗文治益隆天下學士大夫始識正路然惟得其形似而已至於超然茟墨之外深契自得者盖鮮矣古今評詩蔚有定論近世未解考究輙事援筆以肆私見譬之工人規矩不熟於中欲斤斧是馭精巧是期無是理也盖詩之為詩情興景而已二者之遇不得不形於言而非我之所能為者此真詩也苟或牽合補綴可以無作豈詩也哉予近有得於此而年益劭志益落殆不可對人語而亦莫我信也近獲與張君子淵交片言之間輒悟此意出示所作百餘篇其意輒深逺與雕琢相謝絶雖天禀所至亦薰熟有素者夫已有所得而不與知者共非君子用心也喜而為書於卷首至元己夘九月下澣小江艾逸單𢎞叙唐杜甫氏為古今詩人之冠宋黄太史庭堅謂學者宜讀其詩精其句法毎作必使有意為一篇之主乃能成家而或者云宜宗商周而祖漢魏晉宋而下可無學也噫豈黄太史為不知此耶商周之作聖人刪之為經盖方圓之規矩也奚容言哉然曰必祖漢魏則刪後無詩獨漢魏何夫世道升降而文氣從之漢稍近古六義未泯逮鄴下諸子而流風存焉六朝南北非無人也光岳分裂偏駁萎薾其可取者希矣至唐而後陳子昂首恢雅道及杜甫出而集百氏之成雖後有作者蔑以尚茲要之本人情明物理美刺哀樂庶幾三百篇之遺矣非直以其辭而已是可槩以晉宋而下為可廢哉盖商周之詩至漢魏而靡漢魏之詩自杜甫而定學者溯流而求之舍是宜非所先也國朝南北混一宗工繼作以中和雅正之聲而革金宋之餘習學者非杜詩不觀也然昧者剽剟近似襲用一律而不知根本道藝其所以來或者之議豈為過哉四明張君子淵毎與余論及比而觀之今其友㑹稽王良與編集子淵之詩為若干卷以刻諸梓子淵盖知讀杜詩而精其句法者也成一家言以見黄太史之語為不誣兹余之所嘉已故為書其所嘗與論者而序之至正十六年龍集丙申夏五月辛夘浙河楊彛序
