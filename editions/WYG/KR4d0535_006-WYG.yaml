body:
  text: 子淵詩集卷六元張仲深撰五言絶句題時處恭枯木竹石扇瀟湘明月夜眼底見蒼雲衆木皆零落空山秪此君雲山圖流水雲中響青山樹杪多客行山水外落日聽吳歌七言絶句次常山鄭明善長至日見柬絶句團團山郭甫千家地接東南有等差不道山中逢至日家人應是卜燈花逺林旭日曉融融六琯初陽一脉通見說衢州賢太守起觀雲物上華豐衢州有華豐樓次趙文舉簡沙彦博二首行路已知難復難客邊翻憶去年歡騎馬出門雨如注江南江北汎盤盤渭城風雨别離難春樹江雲盡客歡世上紅塵深似海屋頭明月大於盤瑞萱炎風吹老鳳頭花碧幹秋添翡翠牙移向北堂深處種自知戲綵屬君家稚桐分得靈根自嶧陽亭亭翠榦及人長莫辭拱把當風露他日終經宿鳳凰武林感懐四絶句用馬易之韻柬佑聖觀王景周呈王素岩湖山風物逐灰飛媿我行吟雪裏歸認得吳姬年十八從来不减舊腰圍風摶萬鶴下瑶䑓九市無人夜撥灰可惜西湖歌舞地春深觸處長蒿莱紅塵不到老仙家依舊疎櫺幔碧紗宗陽宫佑聖觀獨存兩袖髙寒吟未穏倚欄和雪㸔梅花西湖嵗晏雪如波湖上誰人載酒歌眼底甲兵猶未息可無壯士挽天河雪峯西蜀名山乆失尖天風吹隕見嵁巖願君移置軒窗下要滌人間六月炎眉文硯詩誰斸雲根出混淪一區𤣥璧重璵璠龍香秪解供吟筆不管春山濕黛痕題王良與捕魚圖迤南水陸干戈滿直北關山祲霧多船尾斫魚船首飲人生只合老漁蓑隠居圖我来江口氣如蒸今日披圖眼忽青但見林臯發光怪夜深知有少微星揷花掛畫圖髙人杜門不入市只在西郊結草堂清事惱懐眠不得看花看畫勝公忙題宗上人畫江南六月露華繁凉葉紛紛曉不翻自是故宫風物異至今烟樹滿祗園題墨畫孔雀圖桄榔樹老嶺南春雲外歸来翠滿身常恐文章嬰世網肯將毛羽涴緇塵壁上小景半林斜日帶晴霞仿彿柴桑處士家千里田園歸未得只疑此地有黄花浦景仁蘭竹圖素娥孕魄隕微茫散亂寒光石上霜尚憶楚魂環珮冷至今清思滿瀟湘松亭圖一椽茅屋小如舟百尺長松在上頭更得秋風田二頃底須騎鶴上揚州題嚴景祥畫蘚紋碧䕃虵蚹石山意晴函鶴背雲自是蒼松多野趣未應秪數老髯君董元善畫美鬚髯人號髯君江海十年奔走地草堂今日友朋心平生乞得清洪願只結茅齋住緑隂題天師畫二幅江上羣峯類九華雲中樓閣是誰家幽人怕有看山者自起開門掃落花雨洗枇杷奈翠何白雲如海冩通波小橋分路春烟裏定有人家住澗阿春山遊騎圖淑氣熏人醉似霞子規聲裏欲飛花馬蹄踏徧青山道底事春深未到家馮仁夫木石圖老樹摶風泣瘦螭石稜霜剥玉差差嵗寒雖倚空山底自是巖廊柱石姿紫霞几女媧鍊石補青天文礦無端落海壖舁入小齋供醉隠夢魂時到五雲邊垂杞花隕西風蜀錦香珊瑚蜜貫翠絲長茂陵秋冷牂牁夢肯信餘芳落海鄉小桂根分兎窟翠婆娑秋影團團數尺過自是天香落人世也將金粟鬬嫦娥弔葉監城敬常次許且瞻韻人情盡屬莊周夢世道翻悲墨子絲一日青山瘞寒玉令人瞻望起遐思溪上次岸上人五絶句栁風松雨滿溪漘風雨催殘二分春門外泥塗深馬迹江海紅塵髙没人杏梢紅日帶紅酣零落東風浦水南春老王孫歸未得一川烟雨思何堪溪南溪北燕交飛溪上人家客未歸翠壁夜間山鳥呌金爐燼冷水沉微蒲芽莎草滿沙堤數箇山船繫短籬不去西湖載歌舞却来溪上載相思短短疎籬矮矮門溪頭鷗鳥動成羣酒邊詩句空千首世上兵戈正糾紛
